<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF5F9F'/%3E%3Cpath d='M10 15v-3a6 6 0 0 1 12 0v3' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Crect x='8' y='15' width='16' height='11' rx='3' fill='white'/%3E%3C/svg%3E">
<title>2028 대입 설명회 교육 · 시크릿 자료실</title>
<meta property="og:type" content="website">
<meta property="og:title" content="2028 대입 설명회 교육 · 시크릿 자료실">
<meta property="og:description" content="9월 16일 2028 대입 설명회 교육에 참석하신 원장님만 들어올 수 있는 시크릿 자료실이에요">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
  이 파일은 틀이에요. 직접 올리지 마세요.
  만들기.bat 을 실행하면 자료 설명을 암호화해 이 틀에 넣은 배포용/index.html 이 만들어져요.
  화면을 그리고 파일을 푸는 코드는 모두 여기 있고, 내용(글·파일 목록·영상 주소)은 암호문 안에 있어요.
-->
<style>
  :root{
    --pink:#FF5F9F;
    --pink-deep:#F2448B;   /* 핑크 버튼 호버 — 핑크를 한 톤 진하게 */
    --ink:#191919;
    --gray:#595959;
    --line:#EDEDED;
    --tint:#FFF7FA;
    --hover:#F5F5F5;       /* 흰 버튼 호버 */
    --green:#C2E29B;
    --blue:#AAD0FD;
    --purple:#DCCAFA;
    --yellow:#FBF2A3;
    --danger:#E0455E;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:72px}
  html,body{margin:0}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    font-size:15px;line-height:1.7;color:var(--ink);background:#fff;
    word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;
  }
  body.modal-open{overflow:hidden}
  img{display:block;max-width:100%}
  a{color:inherit;text-underline-offset:3px}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--pink);outline-offset:2px}

  /* ═════════ 잠금 화면 ═════════ */
  .lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:40px 16px}
  .lock .box{width:100%;max-width:400px;text-align:center}
  body.wait .lock .box{visibility:hidden}
  .lock .icon{width:56px;height:56px;margin:0 auto 24px;border-radius:50%;background:var(--tint);color:var(--pink);display:grid;place-items:center}
  .lock .eyebrow{margin:0 0 8px;font-size:13px;color:var(--gray)}
  .lock h1{margin:0 0 16px;font-size:32px;line-height:1.35;font-weight:700;letter-spacing:-0.8px}
  .lock .lead{margin:0 0 32px;font-size:15px;color:var(--gray)}
  .lock form{text-align:left}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .field{position:relative}
  .field input{
    width:100%;height:52px;padding:0 16px;letter-spacing:.5px;font-variant-numeric:tabular-nums;
    font:inherit;font-size:16px;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:8px;transition:border-color .15s,box-shadow .15s;
  }
  .field input::placeholder{color:var(--gray);opacity:.6}
  .field input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,95,159,.18)}
  .err{margin:8px 0 0;font-size:13px;color:var(--danger)}
  .go{display:block;width:100%;height:52px;margin-top:16px;font-size:14px;font-weight:700;color:#fff;background:var(--pink);border:0;border-radius:9px;cursor:pointer;transition:background .15s}
  .go:hover{background:var(--pink-deep)}
  .go:focus-visible{outline:2px solid var(--ink)}
  .go:disabled{opacity:.55;cursor:progress}
  .lock .help{margin:24px 0 0;font-size:13px;color:var(--gray)}
  .lock .help a{color:var(--ink)}

  /* ═════════ 자료실 공통 ═════════ */
  .wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
  @media (min-width:720px){.wrap{padding-inline:24px}}

  .imprint{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding-block:16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--gray)}

  .hero{padding-block:48px 40px;text-align:center}
  .tag{display:inline-flex;align-items:center;height:32px;padding:0 16px;border:1px solid var(--pink);border-radius:999px;font-size:13px;font-weight:600}
  .hero h1{margin:16px 0;font-size:32px;line-height:1.35;font-weight:700;letter-spacing:-0.8px}
  .hero .lead{max-width:640px;margin:0 auto;color:var(--gray)}
  .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:24px 0 0;padding:0;list-style:none}
  .facts li{display:inline-flex;align-items:center;height:32px;padding:0 16px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--gray)}

  /* 위쪽 고정 이동 막대 */
  .topnav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
  .topnav .in{display:flex;gap:8px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
  .topnav .in::-webkit-scrollbar{display:none}
  .navchip{flex:none;display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;color:var(--gray);white-space:nowrap;transition:background .15s,color .15s}
  .navchip:hover{background:var(--hover);color:var(--ink)}
  .navchip[aria-current="true"]{background:var(--pink);color:#fff}

  .sec{padding-block:48px;border-top:1px solid var(--line)}
  .sec:first-child{border-top:0}
  .sec-head{margin-bottom:32px}
  .sec-head .eyebrow{display:block;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--gray)}
  .sec-head h2{margin:0 0 8px;font-size:22px;line-height:1.4;font-weight:700;letter-spacing:-0.5px}
  .sec-head p{margin:0;color:var(--gray)}

  .grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
  @media (min-width:720px){.grid-2,.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:1024px){.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}}

  /* 한눈에 보기 */
  .index a{display:flex;flex-direction:column;gap:8px;height:100%;padding:16px 24px;border:1px solid var(--line);border-radius:13px;text-decoration:none;transition:transform .15s,box-shadow .15s}
  .index a:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(25,25,25,.08)}
  .index b{font-size:16px;font-weight:600;line-height:1.5}
  /* 종류 배지 */
  .kind{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:13px;font-weight:600;line-height:1}
  .kind-xlsx{background:var(--green)}
  .kind-pdf{background:var(--purple)}
  .kind-video{background:var(--blue)}
  .kind-hwp{background:var(--yellow)}
  .kind-file{background:var(--line)}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--gray)}

  /* ═════════ 자료 카드 ═════════ */
  .doc{margin-top:24px;padding:24px 16px;border:1px solid var(--line);border-radius:13px;background:#fff}
  .grid > .doc{margin-top:0}
  @media (min-width:720px){.doc{padding:32px}}
  .doc-head h3{margin:8px 0;font-size:22px;line-height:1.4;font-weight:700;letter-spacing:-0.5px}
  .doc-head .desc{margin:0;max-width:760px}
  .lbl{margin:24px 0 8px;font-size:13px;font-weight:600}
  .points{margin:0;padding:0;list-style:none;max-width:760px}
  .points li{position:relative;margin-bottom:8px;padding-left:16px;color:var(--gray)}
  .points li::before{content:'';position:absolute;left:0;top:.8em;width:4px;height:4px;border-radius:50%;background:var(--pink)}
  .points b{color:var(--ink);font-weight:600}
  .doc-body{margin-top:24px}
  .doc-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}

  /* 버튼 */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:48px;padding:0 24px;border-radius:9px;border:0;
    font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap;cursor:pointer;
    transition:background .15s;
  }
  .btn svg{flex:none}  .btn-main{background:var(--pink);color:#fff}
  .btn-main:hover{background:var(--pink-deep)}
  .btn-sub{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn-sub:hover{background:var(--hover)}
  .btn:disabled{opacity:.55;cursor:progress}
  @media (max-width:559px){.doc-actions .btn{flex:1 1 100%}}

  .status{flex:1 1 100%;margin:0;font-size:13px;color:var(--gray)}
  .status::after{content:'';display:block;height:3px;margin-top:8px;border-radius:2px;width:calc(var(--p,0) * 100%);background:var(--pink);transition:width .2s}
  .status.is-done::after,.status.is-err::after{display:none}
  .status.is-err{color:var(--danger)}

  /* ═════════ 강의자료 (맨 위에 크게) ═════════ */
  .doc.lecture{margin-top:0;border:2px solid var(--pink)}
  .kind-lecture{background:var(--pink);color:#fff}
  .lec-grid{display:grid;gap:24px}
  @media (min-width:1024px){.lec-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:start}}
  .zoom{display:block;width:100%;padding:0;border:0;overflow:hidden;background:#fff;cursor:zoom-in}
  .zoom img{width:100%;aspect-ratio:16/9;object-fit:contain;object-position:center;background:#fff}
  .lec-text h3{margin:8px 0;font-size:32px;line-height:1.3;font-weight:700;letter-spacing:-0.8px}
  .lec-sub{margin:0 0 16px;font-size:15px;font-weight:600;color:var(--gray)}
  .outline{margin:24px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
  .outline li{display:flex;align-items:baseline;gap:16px;padding-block:8px;border-bottom:1px solid var(--line)}
  .outline .no{flex:none;min-width:40px;height:24px;padding:0 8px;border-radius:6px;background:var(--tint);font-size:13px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
  .outline b{display:block;font-weight:600}
  .outline small{display:block;font-size:13px;color:var(--gray)}
  .lecture .doc-actions{margin-top:24px;padding-top:0;border-top:0}

  /* 슬라이드 넘겨 보기 — 옆으로만 밀리고 위아래 스크롤은 페이지로 넘어감 */
  .carousel{min-width:0}
  .carousel .stage{position:relative}
  .carousel .track{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
    border:1px solid var(--line);border-radius:13px;background:#fff;scrollbar-width:none}
  .carousel .track::-webkit-scrollbar{display:none}
  .carousel .slide{flex:0 0 100%;margin:0;scroll-snap-align:start;scroll-snap-stop:always}
  .carousel .cnav{position:absolute;top:50%;margin-top:-20px;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;
    background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(25,25,25,.12);transition:opacity .15s,background .15s}
  .carousel .cnav:hover{background:var(--hover)}
  .carousel .cnav:disabled{opacity:0;pointer-events:none}
  .carousel .prev{left:8px}
  .carousel .next{right:8px}
  .carousel .cbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-top:8px}
  .carousel .count{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .carousel .dots{display:flex;flex-wrap:wrap}
  .carousel .dot{width:24px;height:24px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
  .carousel .dot::before{content:'';width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .15s,background .15s}
  .carousel .dot[aria-current="true"]::before{width:16px;background:var(--pink)}
  .carousel .cnote{margin:8px 0 0;font-size:13px;color:var(--gray)}

  /* ═════════ 영상 (유튜브 · 버니) ═════════ */
  .embed{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--hover)}
  .embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .embed.is-empty{display:grid;place-items:center;text-align:center}
  .embed .poster{padding:24px}
  .embed .play{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:var(--line);color:var(--gray);display:grid;place-items:center}
  .embed .poster b{display:block;font-size:16px;font-weight:600}
  .embed .poster span{font-size:13px;color:var(--gray)}
  /* 누르기 전 표지 — 플레이어는 누를 때 불러온다 */
  .embed .facade{position:absolute;inset:0;width:100%;height:100%;display:grid;place-content:center;justify-items:center;gap:8px;padding:24px;border:0;background:var(--hover);text-align:center;cursor:pointer}
  .embed .facade .play{width:64px;height:64px;margin-bottom:8px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;transition:transform .15s,background .15s}
  .embed .facade:hover .play{background:var(--pink-deep);transform:scale(1.05)}
  .embed .facade b{font-size:16px;font-weight:600;line-height:1.5}
  .embed .facade .sub{font-size:13px;color:var(--gray)}

  /* ═════════ 안내 · 바닥 ═════════ */
  .info{margin:0;padding:0;list-style:none}
  .info li{position:relative;margin-bottom:8px;padding-left:16px;color:var(--gray)}
  .info li::before{content:'';position:absolute;left:0;top:.8em;width:4px;height:4px;border-radius:50%;background:var(--gray)}
  .info b{color:var(--ink);font-weight:600}
  .disclaimer{margin:24px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--gray)}
  .foot{display:flex;flex-wrap:wrap;justify-content:center;gap:0 16px;padding-block:32px 48px;border-top:1px solid var(--line);font-size:13px;color:var(--gray);text-align:center}

  /* 미리보기 크게 보기 */
  .viewer{width:min(820px,calc(100% - 32px));max-width:none;max-height:calc(100% - 32px);padding:0;border:0;border-radius:13px;overflow:auto;background:#fff;color:var(--ink)}
  .viewer::backdrop{background:rgba(25,25,25,.6)}
  .viewer .bar{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 8px 8px 24px;background:#fff;border-bottom:1px solid var(--line)}
  .viewer .cap{font-size:13px;color:var(--gray)}
  .viewer .close{flex:none;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:9px;background:none;cursor:pointer}
  .viewer .close:hover{background:var(--hover)}
  .viewer img{width:100%;height:auto}
</style>
</head>
<body>
<main class="lock" id="lock">
  <div class="box">
    <div class="icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2"/></svg>
    </div>
    <p class="eyebrow">9월 16일 2028 대입 설명회 교육 참석 원장님 전용</p>
    <h1>시크릿 자료실</h1>
    <p class="lead">강의에 참석하신 원장님만을 위한 자료실이에요.<br>강의 참석 때 등록하신 휴대폰 번호를 입력해 주세요.</p>
    <form id="f" novalidate onsubmit="return false">
      <label class="sr" for="pw">휴대폰 번호</label>
      <div class="field">
        <input id="pw" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-1234-5678" autofocus>
      </div>
      <p class="err" id="err" role="alert" hidden></p>
      <button type="submit" class="go" id="go">자료실 열기</button>
    </form>
    <p class="help">번호로 들어오지 못하시면 <a href="https://pf.kakao.com/_xdrlwX/friend" target="_blank" rel="noopener">클럽하와이 CS 채널</a>로 편하게 물어봐 주세요.</p>
  </div>
</main>

<div id="app" hidden></div>

<dialog class="viewer" id="viewer" aria-label="미리보기 크게 보기">
  <div class="bar">
    <span class="cap"></span>
    <button type="button" class="close" aria-label="닫기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <img alt="">

  async function openSlot(kek) {
    for (var i = 0; i < data.slots.length; i++) {
      try {
        return await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(data.slots[i].i) }, kek, fromB64(data.slots[i].w));
      } catch (e) { /* 이 칸은 다른 번호 것 */ }
    }
    throw new Error('등록되지 않은 번호');
  }
  async function unlock(raw, remember) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(data.iv) }, key, fromB64(data.ct));
    var manifest = JSON.parse(new TextDecoder().decode(plain));
    if (remember) storage('set', toB64(raw));
    show(manifest, key);
  }

  var saved = storage('get');
  if (saved) {
    document.body.classList.add('wait');
    unlock(fromB64(saved), false).catch(function () { storage('del'); document.body.classList.remove('wait'); });
  }

  function resetButton() { go.disabled = false; go.textContent = '자료실 열기'; }
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!pw.value.trim()) { showError('휴대폰 번호를 입력해 주세요.'); pw.focus(); return; }
    var phone = normalizePhone(pw.value);
    if (!phone) { showError('휴대폰 번호 11자리를 확인해 주세요.'); pw.focus(); return; }
    err.hidden = true;
    go.disabled = true;
    go.textContent = '확인하는 중…';
    var raw;
    try {
      raw = await openSlot(await phoneKey(phone));
    } catch (ex) {
      resetButton();
      showError('등록된 번호가 아니에요. 강의 참석 때 등록하신 번호인지 확인해 주세요.');
      pw.select();
      return;
    }
    try {
      await unlock(raw, true);
    } catch (ex) {
      resetButton();
      showError('자료실을 열지 못했어요. 페이지를 새로고침한 뒤 다시 시도해 주세요.');
    }
  });
  // 입력하는 대로 010-1234-5678 모양으로 (+82 로 붙여 넣은 번호는 그대로 둠)
  pw.addEventListener('input', function () {
    err.hidden = true;
    var d = pw.value.replace(/\D/g, '');
    if (d.charAt(0) !== '0' || /[^\d\s-]/.test(pw.value)) return;
    d = d.slice(0, 11);
    pw.value = d.length === 11 ? d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7)
      : d.length > 7 ? d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7)
      : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d;
  });

  /* ── 자료실 그리기 ───────────────────── */
  function show(manifest, key) {
    KEY = key;
    M = manifest;
    app.innerHTML = M.html;
    if (M.title) document.title = M.title;
    lock.remove();
    app.hidden = false;
    document.body.classList.remove('wait');
    wireZoom();
    wireFiles();
    wireEmbeds();
    wireCarousels();
    wireNav();
    if (location.hash) {
      var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target) target.scrollIntoView();
    }
  }
  function debounce(fn, ms) {
    var t;
    return function () { clearTimeout(t); t = setTimeout(fn, ms); };
  }

  /* 영상 — 표지를 누르면 그 자리에 유튜브·버니 플레이어를 넣고 바로 재생 */
  function wireEmbeds() {
    $$('.facade').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var u = new URL(btn.dataset.embed);
        u.searchParams.set('autoplay', /mediadelivery/.test(u.hostname) ? 'true' : '1');
        var frame = document.createElement('iframe');
        frame.src = u.href;
        frame.title = btn.dataset.title;
        frame.allow = 'accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen';
        frame.allowFullscreen = true;
        frame.referrerPolicy = 'strict-origin-when-cross-origin';
        btn.replaceWith(frame);
      });
    });
  }

  /* 슬라이드 넘겨 보기 — ‹ › 버튼·점·키보드 화살표, 손가락으로 밀면 스크롤 스냅 */
  function wireCarousels() {
    $$('[data-carousel]').forEach(function (box) {
      var track = $('.track', box), slides = $$('.slide', track), prev = $('.prev', box), next = $('.next', box);
      var count = $('.count', box), dots = $$('.dot', box), cur = 0, ticking = false;
      function paint(i) {
        cur = i;
        count.textContent = (i + 1) + ' / ' + slides.length;
        prev.disabled = i === 0;
        next.disabled = i === slides.length - 1;
        dots.forEach(function (d, k) { d.setAttribute('aria-current', String(k === i)); });
      }
      function goTo(i, smooth) {
        i = Math.max(0, Math.min(slides.length - 1, i));
        track.scrollTo({ left: slides[i].offsetLeft, behavior: smooth === false ? 'auto' : 'smooth' });
        paint(i);
      }
      prev.addEventListener('click', function () { goTo(cur - 1); });
      next.addEventListener('click', function () { goTo(cur + 1); });
      dots.forEach(function (d, k) { d.addEventListener('click', function () { goTo(k); }); });
      track.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur + 1); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur - 1); }
      });
      track.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          ticking = false;
          var i = Math.round(track.scrollLeft / Math.max(track.clientWidth, 1));
          if (i !== cur) paint(Math.max(0, Math.min(slides.length - 1, i)));
        });
      }, { passive: true });
      window.addEventListener('resize', debounce(function () { goTo(cur, false); }, 150));
    });
  }

  /* 강의 슬라이드 크게 보기 */
  function wireZoom() {
    var viewer = $('#viewer'), img = $('img', viewer), cap = $('.cap', viewer);
    $$('.zoom').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var src = $('img', btn);
        img.src = src.src;
        img.alt = src.alt;
        var fc = btn.closest('figure') && $('figcaption', btn.closest('figure'));
        cap.textContent = fc ? fc.textContent : '';
        viewer.showModal();
        document.body.classList.add('modal-open');
        viewer.scrollTop = 0;
      });
    });
    viewer.addEventListener('close', function () { document.body.classList.remove('modal-open'); });
    $('.close', viewer).addEventListener('click', function () { viewer.close(); });
    viewer.addEventListener('click', function (e) { if (e.target === viewer) viewer.close(); });
  }

  /* 이동 막대 — 지금 보고 있는 구역 표시
     (막대 안에서만 옆으로 움직인다. scrollIntoView 는 스크롤 중인 화면까지 붙잡아서 쓰지 않음) */
  function wireNav() {
    var links = $$('.topnav a[href^="#"]');
    var bar = $('.topnav .in');
    if (!links.length || !bar || !('IntersectionObserver' in window)) return;
    var map = {};
    links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        links.forEach(function (a) { a.removeAttribute('aria-current'); });
        var a = map[en.target.id];
        if (a) {
          a.setAttribute('aria-current', 'true');
          var left = a.offsetLeft - bar.offsetLeft, right = left + a.offsetWidth;
          if (left < bar.scrollLeft || right > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = Math.max(0, left - 16);
        }
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    Object.keys(map).forEach(function (id) { var el = document.getElementById(id); if (el) io.observe(el); });
  }

  /* ── 잠긴 파일 받아서 풀기 ───────────── */
  function human(n) {
    if (n >= 1048576) return (n / 1048576).toFixed(n >= 10485760 ? 0 : 1) + 'MB';
    return Math.max(1, Math.round(n / 1024)) + 'KB';
  }
  function setStatus(fid, msg, state, ratio) {
    $$('[data-status="' + fid + '"]').forEach(function (s) {
      s.hidden = !msg;
      s.textContent = msg || '';
      s.classList.toggle('is-err', state === 'err');
      s.classList.toggle('is-done', state === 'done');
      s.style.setProperty('--p', ratio == null ? 0 : ratio);
    });
  }
  function setBusy(fid, on) {
    $$('[data-file="' + fid + '"]').forEach(function (b) { b.disabled = on; b.setAttribute('aria-busy', String(on)); });
  }
  /* 휴대폰 네트워크가 잠깐 끊겨도 조각 하나당 세 번까지 다시 받는다 */
  async function fetchChunk(url, onBytes) {
    var lastErr;
    for (var attempt = 0; attempt < 3; attempt++) {
      var got = 0;
      try {
        return await fetchOnce(url, function (n) { got += n; onBytes(n); });
      } catch (e) {
        lastErr = e;
        onBytes(-got);   // 실패한 시도에서 센 만큼 진행률을 되돌림
        if (location.protocol === 'file:') break;
        await new Promise(function (r) { setTimeout(r, 800 * (attempt + 1)); });
      }
    }
    throw lastErr;
  }
  async function fetchOnce(url, onBytes) {
    var res = await fetch(url, { cache: 'force-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (!res.body || !res.body.getReader) {
      var whole = await res.arrayBuffer();
      onBytes(whole.byteLength);
      return whole;
    }
    var reader = res.body.getReader(), parts = [], got = 0;
    for (;;) {
      var r = await reader.read();
      if (r.done) break;
      parts.push(r.value);
      got += r.value.byteLength;
      onBytes(r.value.byteLength);
    }
    var out = new Uint8Array(got), off = 0;
    parts.forEach(function (p) { out.set(p, off); off += p.byteLength; });
    return out.buffer;
  }
  function getBlob(fid) {
    if (blobs[fid]) return blobs[fid];
    var f = M.files[fid];
    blobs[fid] = (async function () {
      var base = fromB64(f.nonce);
      var total = f.chunks.reduce(function (s, c) { return s + c.size; }, 0);
      var done = 0, parts = [];
      for (var i = 0; i < f.chunks.length; i++) {
        var ct = await fetchChunk(new URL(f.chunks[i].url, location.href).href, function (n) {
          done += n;
          var r = Math.min(Math.max(done / total, 0), 1);
          setStatus(fid, '받는 중 ' + Math.round(r * 100) + '% · ' + human(Math.max(done, 0)) + ' / ' + human(total), null, r);
        });
        var iv = new Uint8Array(12);
        iv.set(base, 0);
        new DataView(iv.buffer).setUint32(8, i);
        parts.push(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, KEY, ct));
      }
      return new Blob(parts, { type: f.mime });
    })();
    blobs[fid].catch(function () { delete blobs[fid]; });
    return blobs[fid];
  }
  function failMsg(e) {
    if (location.protocol === 'file:') return '컴퓨터에서 바로 연 파일에서는 자료를 받을 수 없어요. 인터넷 주소로 올린 뒤 열어 주세요.';
    if (e && e.name === 'OperationError') return '파일이 이 페이지와 짝이 맞지 않아요. 배포용 폴더를 통째로 다시 올려 주세요.';
    return '받지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
  }
  function wireFiles() {
    $$('[data-file][data-act]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var fid = btn.dataset.file, act = btn.dataset.act, f = M.files[fid];
        if (!f) return;
        var popup = null;
        if (act === 'open') {
          popup = window.open('', '_blank');
          if (popup) popup.document.write('<title>여는 중…</title><p style="font-family:sans-serif;padding:24px">파일을 여는 중이에요…</p>');
        }
        setBusy(fid, true);
        try {
          var blob = await getBlob(fid);
          var url = urls[fid] || (urls[fid] = URL.createObjectURL(blob));
          if (act === 'open' && popup && !popup.closed) {
            popup.location.href = url;
            setStatus(fid, '새 창에서 열었어요. 창이 보이지 않으면 「받기」를 눌러 주세요.', 'done');
          } else {
            // 새 창이 막힌 곳(앱 안 브라우저 등)에서는 자료실을 떠나지 않고 받기로 바꾼다
            var a = document.createElement('a');
            a.href = url;
            a.download = f.name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setStatus(fid, (act === 'open' ? '새 창이 막혀 있어 파일 받기로 바꿨어요 · ' : '받기를 시작했어요 · ') + f.name, 'done');
          }
        } catch (e) {
          if (popup) popup.close();
          setStatus(fid, failMsg(e), 'err');
        } finally {
          setBusy(fid, false);
        }
      });
    });
  }
})();
</script>
</body>
</html>
